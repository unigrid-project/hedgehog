<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" aria-labelledby="title desc">
<title id="title">Loss probability between two repairs at default settings</title>
<desc id="desc">A heat map of the probability that a group, a stripe or the manifest set is lost when every fragment is lost independently with probability q of 1, 5, 10, 20 or 30 percent, computed exactly from the binomial distribution for the default layout.</desc>
<rect x="0" y="0" width="960" height="372" fill="#fcfcfb" stroke="#d0d7de"/>
<text x="24" y="30" font-family="sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">Loss probability between two repairs, default layout</text>
<text x="24" y="50" font-family="sans-serif" font-size="12" fill="#52514e" text-anchor="start">Every fragment lost independently with probability q and no repair in between; exact binomial sums</text>
<text x="360" y="80" font-family="sans-serif" font-size="12" fill="#52514e" text-anchor="middle">q = 1 %</text>
<text x="484" y="80" font-family="sans-serif" font-size="12" fill="#52514e" text-anchor="middle">q = 5 %</text>
<text x="608" y="80" font-family="sans-serif" font-size="12" fill="#52514e" text-anchor="middle">q = 10 %</text>
<text x="732" y="80" font-family="sans-serif" font-size="12" fill="#52514e" text-anchor="middle">q = 20 %</text>
<text x="856" y="80" font-family="sans-serif" font-size="12" fill="#52514e" text-anchor="middle">q = 30 %</text>
<text x="24" y="110" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="start">Group, 24 fragments held</text>
<rect x="300" y="90" width="120" height="30" rx="3" fill="#6da7ec" stroke="#6da7ec" stroke-width="1"/>
<text x="360" y="110" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">1.1 × 10<tspan dy="-6" font-size="9">−12</tspan></text>
<rect x="424" y="90" width="120" height="30" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/>
<text x="484" y="110" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">1.3 × 10<tspan dy="-6" font-size="9">−6</tspan></text>
<rect x="548" y="90" width="120" height="30" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/>
<text x="608" y="110" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">3.2 × 10<tspan dy="-6" font-size="9">−4</tspan></text>
<rect x="672" y="90" width="120" height="30" rx="3" fill="#1c5cab" stroke="#1c5cab" stroke-width="1"/>
<text x="732" y="110" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">3.6 × 10<tspan dy="-6" font-size="9">−2</tspan></text>
<rect x="796" y="90" width="120" height="30" rx="3" fill="#0d366b" stroke="#0d366b" stroke-width="1"/>
<text x="856" y="110" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">2.7 × 10<tspan dy="-6" font-size="9">−1</tspan></text>
<text x="24" y="144" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="start">Group, all 32 fragments held</text>
<rect x="300" y="124" width="120" height="30" rx="3" fill="#9ec5f4" stroke="#9ec5f4" stroke-width="1"/>
<text x="360" y="144" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">4.9 × 10<tspan dy="-6" font-size="9">−26</tspan></text>
<rect x="424" y="124" width="120" height="30" rx="3" fill="#9ec5f4" stroke="#9ec5f4" stroke-width="1"/>
<text x="484" y="144" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">2.1 × 10<tspan dy="-6" font-size="9">−14</tspan></text>
<rect x="548" y="124" width="120" height="30" rx="3" fill="#6da7ec" stroke="#6da7ec" stroke-width="1"/>
<text x="608" y="144" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">1.3 × 10<tspan dy="-6" font-size="9">−9</tspan></text>
<rect x="672" y="124" width="120" height="30" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/>
<text x="732" y="144" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">3.3 × 10<tspan dy="-6" font-size="9">−5</tspan></text>
<rect x="796" y="124" width="120" height="30" rx="3" fill="#1c5cab" stroke="#1c5cab" stroke-width="1"/>
<text x="856" y="144" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">5.2 × 10<tspan dy="-6" font-size="9">−3</tspan></text>
<text x="24" y="178" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="start">Full stripe, 32 + 16 groups</text>
<rect x="300" y="158" width="120" height="30" rx="3" fill="#cde2fb" stroke="#cde2fb" stroke-width="1"/>
<text x="360" y="178" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">4.0 × 10<tspan dy="-6" font-size="9">−191</tspan></text>
<rect x="424" y="158" width="120" height="30" rx="3" fill="#cde2fb" stroke="#cde2fb" stroke-width="1"/>
<text x="484" y="178" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">2.9 × 10<tspan dy="-6" font-size="9">−88</tspan></text>
<rect x="548" y="158" width="120" height="30" rx="3" fill="#cde2fb" stroke="#cde2fb" stroke-width="1"/>
<text x="608" y="178" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">1.7 × 10<tspan dy="-6" font-size="9">−47</tspan></text>
<rect x="672" y="158" width="120" height="30" rx="3" fill="#9ec5f4" stroke="#9ec5f4" stroke-width="1"/>
<text x="732" y="178" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">4.5 × 10<tspan dy="-6" font-size="9">−13</tspan></text>
<rect x="796" y="158" width="120" height="30" rx="3" fill="#0d366b" stroke="#0d366b" stroke-width="1"/>
<text x="856" y="178" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">1.4 × 10<tspan dy="-6" font-size="9">−1</tspan></text>
<text x="24" y="212" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="start">Stripe of 5 + 3 groups</text>
<rect x="300" y="192" width="120" height="30" rx="3" fill="#cde2fb" stroke="#cde2fb" stroke-width="1"/>
<text x="360" y="212" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">1.2 × 10<tspan dy="-6" font-size="9">−46</tspan></text>
<rect x="424" y="192" width="120" height="30" rx="3" fill="#9ec5f4" stroke="#9ec5f4" stroke-width="1"/>
<text x="484" y="212" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">1.9 × 10<tspan dy="-6" font-size="9">−22</tspan></text>
<rect x="548" y="192" width="120" height="30" rx="3" fill="#9ec5f4" stroke="#9ec5f4" stroke-width="1"/>
<text x="608" y="212" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">7.4 × 10<tspan dy="-6" font-size="9">−13</tspan></text>
<rect x="672" y="192" width="120" height="30" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/>
<text x="732" y="212" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">1.1 × 10<tspan dy="-6" font-size="9">−4</tspan></text>
<rect x="796" y="192" width="120" height="30" rx="3" fill="#0d366b" stroke="#0d366b" stroke-width="1"/>
<text x="856" y="212" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">1.5 × 10<tspan dy="-6" font-size="9">−1</tspan></text>
<text x="24" y="246" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="start">Stripe of 1 + 1 groups</text>
<rect x="300" y="226" width="120" height="30" rx="3" fill="#9ec5f4" stroke="#9ec5f4" stroke-width="1"/>
<text x="360" y="246" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">1.3 × 10<tspan dy="-6" font-size="9">−24</tspan></text>
<rect x="424" y="226" width="120" height="30" rx="3" fill="#6da7ec" stroke="#6da7ec" stroke-width="1"/>
<text x="484" y="246" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">1.6 × 10<tspan dy="-6" font-size="9">−12</tspan></text>
<rect x="548" y="226" width="120" height="30" rx="3" fill="#6da7ec" stroke="#6da7ec" stroke-width="1"/>
<text x="608" y="246" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">1.0 × 10<tspan dy="-6" font-size="9">−7</tspan></text>
<rect x="672" y="226" width="120" height="30" rx="3" fill="#1c5cab" stroke="#1c5cab" stroke-width="1"/>
<text x="732" y="246" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">1.3 × 10<tspan dy="-6" font-size="9">−3</tspan></text>
<rect x="796" y="226" width="120" height="30" rx="3" fill="#1c5cab" stroke="#1c5cab" stroke-width="1"/>
<text x="856" y="246" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">7.6 × 10<tspan dy="-6" font-size="9">−2</tspan></text>
<text x="24" y="280" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="start">Manifest, 3 copies</text>
<rect x="300" y="260" width="120" height="30" rx="3" fill="#cde2fb" stroke="#cde2fb" stroke-width="1"/>
<text x="360" y="280" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">1.5 × 10<tspan dy="-6" font-size="9">−36</tspan></text>
<rect x="424" y="260" width="120" height="30" rx="3" fill="#9ec5f4" stroke="#9ec5f4" stroke-width="1"/>
<text x="484" y="280" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">2.1 × 10<tspan dy="-6" font-size="9">−18</tspan></text>
<rect x="548" y="260" width="120" height="30" rx="3" fill="#6da7ec" stroke="#6da7ec" stroke-width="1"/>
<text x="608" y="280" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">3.3 × 10<tspan dy="-6" font-size="9">−11</tspan></text>
<rect x="672" y="260" width="120" height="30" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/>
<text x="732" y="280" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">4.7 × 10<tspan dy="-6" font-size="9">−5</tspan></text>
<rect x="796" y="260" width="120" height="30" rx="3" fill="#1c5cab" stroke="#1c5cab" stroke-width="1"/>
<text x="856" y="280" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">2.1 × 10<tspan dy="-6" font-size="9">−2</tspan></text>
<text x="24" y="312" font-family="sans-serif" font-size="11" fill="#52514e" text-anchor="start">Stripe and manifest rows assume 24 fragments held per group. Correlated failures, such as one operator or data centre, are not modelled.</text>
<text x="24" y="346" font-family="sans-serif" font-size="11" fill="#52514e" text-anchor="start">Shading by order of magnitude:</text>
<rect x="222" y="335" width="16" height="14" rx="2" fill="#cde2fb" stroke="#cde2fb" stroke-width="1"/>
<text x="244" y="346" font-family="sans-serif" font-size="11" fill="#52514e" text-anchor="start">below 10<tspan dy="-6" font-size="9">−30</tspan></text>
<rect x="338" y="335" width="16" height="14" rx="2" fill="#9ec5f4" stroke="#9ec5f4" stroke-width="1"/>
<text x="360" y="346" font-family="sans-serif" font-size="11" fill="#52514e" text-anchor="start">from 10<tspan dy="-6" font-size="9">−30</tspan></text>
<rect x="450" y="335" width="16" height="14" rx="2" fill="#6da7ec" stroke="#6da7ec" stroke-width="1"/>
<text x="472" y="346" font-family="sans-serif" font-size="11" fill="#52514e" text-anchor="start">from 10<tspan dy="-6" font-size="9">−12</tspan></text>
<rect x="562" y="335" width="16" height="14" rx="2" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/>
<text x="584" y="346" font-family="sans-serif" font-size="11" fill="#52514e" text-anchor="start">from 10<tspan dy="-6" font-size="9">−6</tspan></text>
<rect x="668" y="335" width="16" height="14" rx="2" fill="#1c5cab" stroke="#1c5cab" stroke-width="1"/>
<text x="690" y="346" font-family="sans-serif" font-size="11" fill="#52514e" text-anchor="start">from 10<tspan dy="-6" font-size="9">−3</tspan></text>
<rect x="774" y="335" width="16" height="14" rx="2" fill="#0d366b" stroke="#0d366b" stroke-width="1"/>
<text x="796" y="346" font-family="sans-serif" font-size="11" fill="#52514e" text-anchor="start">from 10<tspan dy="-6" font-size="9">−1</tspan></text>
</svg>
