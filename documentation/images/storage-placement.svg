<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="sans-serif" role="img" aria-labelledby="title desc">
	<title id="title">Rendezvous placement of a storage group</title>
	<desc id="desc">Each group ranks the ACTIVE gridnodes by a hash score. At default settings the 40 highest ranks form the window: ranks 0 to 23 take the guaranteed fragments, 24 to 31 the extras, and 32 to 39 are spares for retries.</desc>

	<rect x="0" y="0" width="960" height="520" fill="#f8f9fb"/>
	<text x="32" y="42" font-size="22" font-weight="bold" fill="#1f2933">Rendezvous placement of a group</text>
	<text x="32" y="66" font-size="13" fill="#3d4a57">Every ACTIVE gridnode scores SHA-256 of the group id followed by its own id. The highest scores form the window.</text>

	<text x="32" y="104" font-size="15" font-weight="bold" fill="#1f2933">Two groups rank the same ten gridnodes differently</text>
	<g font-size="13" fill="#1f2933">
		<text x="32" y="142">group 1</text>
		<text x="32" y="186">group 2</text>
	</g>
	<g font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2933">
		<rect x="120" y="122" width="48" height="30" rx="5" fill="#cfe0f3" stroke="#3b6ea8"/><text x="144" y="142">C</text>
		<rect x="176" y="122" width="48" height="30" rx="5" fill="#cfe0f3" stroke="#3b6ea8"/><text x="200" y="142">H</text>
		<rect x="232" y="122" width="48" height="30" rx="5" fill="#cfe0f3" stroke="#3b6ea8"/><text x="256" y="142">A</text>
		<rect x="288" y="122" width="48" height="30" rx="5" fill="#cfe0f3" stroke="#3b6ea8"/><text x="312" y="142">J</text>
		<rect x="344" y="122" width="48" height="30" rx="5" fill="#cfe0f3" stroke="#3b6ea8"/><text x="368" y="142">E</text>
		<rect x="400" y="122" width="48" height="30" rx="5" fill="#cfe0f3" stroke="#3b6ea8"/><text x="424" y="142">B</text>
		<rect x="456" y="122" width="48" height="30" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-dasharray="4 3"/><text x="480" y="142">G</text>
		<rect x="512" y="122" width="48" height="30" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-dasharray="4 3"/><text x="536" y="142">D</text>
		<rect x="568" y="122" width="48" height="30" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-dasharray="4 3"/><text x="592" y="142">I</text>
		<rect x="624" y="122" width="48" height="30" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-dasharray="4 3"/><text x="648" y="142">F</text>

		<rect x="120" y="166" width="48" height="30" rx="5" fill="#cfe0f3" stroke="#3b6ea8"/><text x="144" y="186">G</text>
		<rect x="176" y="166" width="48" height="30" rx="5" fill="#cfe0f3" stroke="#3b6ea8"/><text x="200" y="186">B</text>
		<rect x="232" y="166" width="48" height="30" rx="5" fill="#cfe0f3" stroke="#3b6ea8"/><text x="256" y="186">I</text>
		<rect x="288" y="166" width="48" height="30" rx="5" fill="#cfe0f3" stroke="#3b6ea8"/><text x="312" y="186">D</text>
		<rect x="344" y="166" width="48" height="30" rx="5" fill="#cfe0f3" stroke="#3b6ea8"/><text x="368" y="186">A</text>
		<rect x="400" y="166" width="48" height="30" rx="5" fill="#cfe0f3" stroke="#3b6ea8"/><text x="424" y="186">F</text>
		<rect x="456" y="166" width="48" height="30" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-dasharray="4 3"/><text x="480" y="186">C</text>
		<rect x="512" y="166" width="48" height="30" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-dasharray="4 3"/><text x="536" y="186">J</text>
		<rect x="568" y="166" width="48" height="30" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-dasharray="4 3"/><text x="592" y="186">H</text>
		<rect x="624" y="166" width="48" height="30" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-dasharray="4 3"/><text x="648" y="186">E</text>
	</g>
	<g font-size="11" fill="#5b6670" text-anchor="middle">
		<text x="144" y="212">0</text><text x="200" y="212">1</text><text x="256" y="212">2</text><text x="312" y="212">3</text>
		<text x="368" y="212">4</text><text x="424" y="212">5</text><text x="480" y="212">6</text><text x="536" y="212">7</text>
		<text x="592" y="212">8</text><text x="648" y="212">9</text>
	</g>
	<path d="M120,216 v6 H448 v-6" fill="none" stroke="#3b6ea8" stroke-width="1.5"/>
	<text x="284" y="240" font-size="12" fill="#1f2933" text-anchor="middle">window, six ranks in this toy network</text>
	<g font-size="13" fill="#3d4a57">
		<text x="704" y="134">Nothing records where a</text>
		<text x="704" y="152">group lives. Any node with</text>
		<text x="704" y="170">the same list of ACTIVE</text>
		<text x="704" y="188">gridnodes computes the</text>
		<text x="704" y="206">same ranking.</text>
	</g>

	<text x="32" y="272" font-size="15" font-weight="bold" fill="#1f2933">One group at default settings: W = n_max + placementSlack = 32 + 8 = 40</text>
	<path d="M48,304 v-6 H766 v6" fill="none" stroke="#1f2933" stroke-width="1.5"/>
	<text x="407" y="292" font-size="12" fill="#1f2933" text-anchor="middle">the window: the 40 highest scores</text>
	<path d="M48,326 v-6 H370 v6" fill="none" stroke="#3b6ea8" stroke-width="1.5"/>
	<text x="209" y="315" font-size="12" fill="#1f2933" text-anchor="middle">asked first when reading: 16 + 2 = 18</text>

	<g stroke-width="1">
		<g fill="#cfe0f3" stroke="#3b6ea8">
			<rect x="48" y="332" width="16" height="26"/><rect x="66" y="332" width="16" height="26"/><rect x="84" y="332" width="16" height="26"/><rect x="102" y="332" width="16" height="26"/>
			<rect x="120" y="332" width="16" height="26"/><rect x="138" y="332" width="16" height="26"/><rect x="156" y="332" width="16" height="26"/><rect x="174" y="332" width="16" height="26"/>
			<rect x="192" y="332" width="16" height="26"/><rect x="210" y="332" width="16" height="26"/><rect x="228" y="332" width="16" height="26"/><rect x="246" y="332" width="16" height="26"/>
			<rect x="264" y="332" width="16" height="26"/><rect x="282" y="332" width="16" height="26"/><rect x="300" y="332" width="16" height="26"/><rect x="318" y="332" width="16" height="26"/>
			<rect x="336" y="332" width="16" height="26"/><rect x="354" y="332" width="16" height="26"/><rect x="372" y="332" width="16" height="26"/><rect x="390" y="332" width="16" height="26"/>
			<rect x="408" y="332" width="16" height="26"/><rect x="426" y="332" width="16" height="26"/><rect x="444" y="332" width="16" height="26"/><rect x="462" y="332" width="16" height="26"/>
		</g>
		<g fill="#f8dcc0" stroke="#c27a2c">
			<rect x="480" y="332" width="16" height="26"/><rect x="498" y="332" width="16" height="26"/><rect x="516" y="332" width="16" height="26"/><rect x="534" y="332" width="16" height="26"/>
			<rect x="552" y="332" width="16" height="26"/><rect x="570" y="332" width="16" height="26"/><rect x="588" y="332" width="16" height="26"/><rect x="606" y="332" width="16" height="26"/>
		</g>
		<g fill="#e3e6ea" stroke="#8a949e">
			<rect x="624" y="332" width="16" height="26"/><rect x="642" y="332" width="16" height="26"/><rect x="660" y="332" width="16" height="26"/><rect x="678" y="332" width="16" height="26"/>
			<rect x="696" y="332" width="16" height="26"/><rect x="714" y="332" width="16" height="26"/><rect x="732" y="332" width="16" height="26"/><rect x="750" y="332" width="16" height="26"/>
		</g>
		<g fill="#ffffff" stroke="#9aa4ae" stroke-dasharray="3 2">
			<rect x="768" y="332" width="16" height="26"/><rect x="786" y="332" width="16" height="26"/><rect x="804" y="332" width="16" height="26"/>
			<rect x="822" y="332" width="16" height="26"/><rect x="840" y="332" width="16" height="26"/><rect x="858" y="332" width="16" height="26"/>
		</g>
	</g>
	<g font-size="11" fill="#5b6670" text-anchor="middle">
		<text x="56" y="372">0</text><text x="470" y="372">23</text><text x="488" y="372">24</text><text x="614" y="372">31</text>
		<text x="632" y="372">32</text><text x="758" y="372">39</text><text x="776" y="372">40</text>
	</g>
	<path d="M48,378 v6 H478 v-6" fill="none" stroke="#3b6ea8" stroke-width="1.5"/>
	<path d="M480,378 v6 H622 v-6" fill="none" stroke="#c27a2c" stroke-width="1.5"/>
	<path d="M624,378 v6 H766 v-6" fill="none" stroke="#8a949e" stroke-width="1.5"/>
	<path d="M768,378 v6 H874 v-6" fill="none" stroke="#9aa4ae" stroke-width="1.5"/>
	<g font-size="12" fill="#1f2933" text-anchor="middle">
		<text x="263" y="400">guaranteed fragments 0 to 23</text>
		<text x="263" y="416">every store is awaited</text>
		<text x="551" y="400">extras 24 to 31</text>
		<text x="551" y="416">sent, not awaited</text>
		<text x="695" y="400">spares</text>
		<text x="695" y="416">retries land here</text>
		<text x="821" y="400">outside</text>
		<text x="821" y="416">the window</text>
	</g>

	<g font-size="13" fill="#3d4a57">
		<text x="32" y="452">Guaranteed fragment i goes to rank i. A refusal or a missing connection is retried on the next spare, one after another.</text>
		<text x="32" y="472">A gridnode that joins inside the window pushes one member out, and that holder hands its fragment back into the window.</text>
		<text x="32" y="492">A gridnode that leaves moves nothing: its fragment is simply missing until repair restores it.</text>
	</g>
</svg>
