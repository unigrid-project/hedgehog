<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="sans-serif" role="img" aria-labelledby="title desc">
	<title id="title">Storage repair epochs and duty rotation</title>
	<desc id="desc">A gridnode waits two epoch boundaries after it first sees a valid spork, then runs one repair round per epoch. Duty for a group rotates through the 40 ranks of its window one epoch at a time, and spot checks run in one rotation out of four.</desc>

	<rect x="0" y="0" width="960" height="560" fill="#f8f9fb"/>
	<text x="32" y="42" font-size="22" font-weight="bold" fill="#1f2933">Repair epochs and duty rotation</text>
	<text x="32" y="66" font-size="13" fill="#3d4a57">An epoch is wall-clock time divided by repairIntervalMinutes, 60 by default. RepairService looks once a minute.</text>

	<text x="32" y="100" font-size="15" font-weight="bold" fill="#1f2933">One gridnode after it starts</text>
	<rect x="100" y="130" width="132" height="34" fill="#e3e6ea" stroke="#8a949e"/>
	<text x="166" y="152" font-size="13" fill="#1f2933" text-anchor="middle">settling</text>
	<g fill="#cfe0f3" stroke="#3b6ea8">
		<rect x="236" y="136" width="26" height="22"/><rect x="302" y="136" width="26" height="22"/><rect x="368" y="136" width="26" height="22"/>
		<rect x="434" y="136" width="26" height="22"/><rect x="500" y="136" width="26" height="22"/><rect x="566" y="136" width="26" height="22"/>
		<rect x="632" y="136" width="26" height="22"/><rect x="698" y="136" width="26" height="22"/><rect x="764" y="136" width="26" height="22"/>
		<rect x="830" y="136" width="26" height="22"/>
	</g>
	<g fill="#3d8b5a">
		<circle cx="268" cy="147" r="4"/><circle cx="334" cy="147" r="4"/><circle cx="400" cy="147" r="4"/><circle cx="466" cy="147" r="4"/>
		<circle cx="532" cy="147" r="4"/><circle cx="598" cy="147" r="4"/><circle cx="664" cy="147" r="4"/><circle cx="730" cy="147" r="4"/>
		<circle cx="796" cy="147" r="4"/><circle cx="862" cy="147" r="4"/>
	</g>
	<line x1="100" y1="170" x2="892" y2="170" stroke="#1f2933" stroke-width="1.5"/>
	<g stroke="#1f2933" stroke-width="1.5">
		<line x1="100" y1="164" x2="100" y2="176"/><line x1="166" y1="164" x2="166" y2="176"/><line x1="232" y1="164" x2="232" y2="176"/>
		<line x1="298" y1="164" x2="298" y2="176"/><line x1="364" y1="164" x2="364" y2="176"/><line x1="430" y1="164" x2="430" y2="176"/>
		<line x1="496" y1="164" x2="496" y2="176"/><line x1="562" y1="164" x2="562" y2="176"/><line x1="628" y1="164" x2="628" y2="176"/>
		<line x1="694" y1="164" x2="694" y2="176"/><line x1="760" y1="164" x2="760" y2="176"/><line x1="826" y1="164" x2="826" y2="176"/>
		<line x1="892" y1="164" x2="892" y2="176"/>
	</g>
	<g font-size="12" fill="#1f2933" text-anchor="middle">
		<text x="133" y="192">e</text><text x="199" y="192">e+1</text><text x="265" y="192">e+2</text><text x="331" y="192">e+3</text>
		<text x="397" y="192">e+4</text><text x="463" y="192">e+5</text><text x="529" y="192">e+6</text><text x="595" y="192">e+7</text>
		<text x="661" y="192">e+8</text><text x="727" y="192">e+9</text><text x="793" y="192">e+10</text><text x="859" y="192">e+11</text>
	</g>
	<circle cx="112" cy="170" r="5" fill="#1f2933"/>
	<text x="32" y="174" font-size="12" fill="#1f2933">start</text>
	<g font-size="12" fill="#1f2933">
		<text x="100" y="216">The first tick that sees a valid spork records epoch e. Nothing is touched before epoch e+2, a full interval later.</text>
		<rect x="100" y="230" width="14" height="12" fill="#cfe0f3" stroke="#3b6ea8"/>
		<text x="122" y="241">one round per epoch, at the first one-minute tick after the boundary</text>
		<circle cx="107" cy="256" r="4" fill="#3d8b5a"/>
		<text x="122" y="260">expired tombstones purged at the end of every round, on every node</text>
	</g>

	<text x="32" y="304" font-size="15" font-weight="bold" fill="#1f2933">Duty for one group: rank on duty = (epoch + first four bytes of the group id) mod 40</text>
	<g font-size="11" fill="#5b6670" text-anchor="middle">
		<rect x="103" y="322" width="60" height="32" fill="#f1f2f4" stroke="#c4cad1"/><text x="133" y="342">no round</text>
		<rect x="169" y="322" width="60" height="32" fill="#f1f2f4" stroke="#c4cad1"/><text x="199" y="342">no round</text>
	</g>
	<g font-size="12" fill="#1f2933" text-anchor="middle">
		<rect x="235" y="322" width="60" height="32" fill="#e3e6ea" stroke="#8a949e"/><text x="265" y="342">rank 36</text>
		<rect x="301" y="322" width="60" height="32" fill="#e3e6ea" stroke="#8a949e"/><text x="331" y="342">rank 37</text>
		<rect x="367" y="322" width="60" height="32" fill="#e3e6ea" stroke="#8a949e"/><text x="397" y="342">rank 38</text>
		<rect x="433" y="322" width="60" height="32" fill="#e3e6ea" stroke="#8a949e"/><text x="463" y="342">rank 39</text>
		<rect x="499" y="322" width="60" height="32" fill="#cfe0f3" stroke="#3b6ea8"/><text x="529" y="342">rank 0</text>
		<rect x="565" y="322" width="60" height="32" fill="#cfe0f3" stroke="#3b6ea8"/><text x="595" y="342">rank 1</text>
		<rect x="631" y="322" width="60" height="32" fill="#cfe0f3" stroke="#3b6ea8"/><text x="661" y="342">rank 2</text>
		<rect x="697" y="322" width="60" height="32" fill="#cfe0f3" stroke="#3b6ea8"/><text x="727" y="342">rank 3</text>
		<rect x="763" y="322" width="60" height="32" fill="#cfe0f3" stroke="#3b6ea8"/><text x="793" y="342">rank 4</text>
		<rect x="829" y="322" width="60" height="32" fill="#cfe0f3" stroke="#3b6ea8"/><text x="859" y="342">rank 5</text>
	</g>
	<g font-size="11" fill="#3d4a57" text-anchor="middle">
		<text x="265" y="370">no visit</text><text x="331" y="370">no visit</text><text x="397" y="370">no visit</text><text x="463" y="370">no visit</text>
		<text x="529" y="370">visit</text><text x="595" y="370">visit</text><text x="661" y="370">visit</text><text x="727" y="370">visit</text>
		<text x="793" y="370">visit</text><text x="859" y="370">visit</text>
	</g>
	<line x1="496" y1="314" x2="496" y2="378" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4"/>
	<text x="496" y="394" font-size="12" fill="#1f2933" text-anchor="middle">a new rotation begins at rank 0</text>
	<text x="32" y="420" font-size="13" fill="#3d4a57">Spare ranks 32 to 39 hold nothing, so nobody checks the group in those epochs. Every holder is on duty once every 40 epochs.</text>

	<text x="32" y="456" font-size="15" font-weight="bold" fill="#1f2933">Spot checks: one rotation in four</text>
	<g font-size="12" fill="#1f2933" text-anchor="middle">
		<rect x="100" y="470" width="198" height="30" fill="#cfe0f3" stroke="#3b6ea8"/><text x="199" y="490">4k: spot checks on</text>
		<rect x="298" y="470" width="198" height="30" fill="#ffffff" stroke="#8a949e"/><text x="397" y="490">4k+1: census only</text>
		<rect x="496" y="470" width="198" height="30" fill="#ffffff" stroke="#8a949e"/><text x="595" y="490">4k+2: census only</text>
		<rect x="694" y="470" width="198" height="30" fill="#ffffff" stroke="#8a949e"/><text x="793" y="490">4k+3: census only</text>
	</g>
	<text x="32" y="528" font-size="13" fill="#3d4a57">A rotation is W = 40 epochs, 40 hours at defaults, so each holder checks one claim on every fourth of its duty visits.</text>
</svg>
