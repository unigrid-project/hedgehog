name: Build Windows Native

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build All and Install
        run: mvn clean install -DskipTests=true

      - name: Build Native Image
        # Windows-specifikt: Vi kör i en CMD-shell för att säkerställa att MSVC hittas
        shell: cmd /C call vcvarsall.bat x64 && mvn package -pl native-image -am -DskipTests=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hedgehog-windows
          path: native-image/target/hedgehog.exe
          
          