name: Build Windows Native

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Tests
        # Vi kör endast tester i application-modulen
        run: mvn test -pl application -Pci "-Dtest.threshold=0.3" "-Dtest.envFactor=15"
        env:
          CI: "true"

      - name: Build Native Image
        # Pluginet hittas nu automatiskt i native-image/pom.xml
        run: mvn package -pl native-image -am -DskipTests=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hedgehog-windows
          path: native-image/target/hedgehog.exe
          