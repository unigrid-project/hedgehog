name: Build Windows (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # GraalVM Native Image requires the MSVC environment to be set up first
    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven

    - name: Build with Maven
      shell: cmd
      # We pass allow-incomplete-classpath inside the official graalvm property to bypass 
      # the Weld/Netty static tracking faults during a strict clean install cycle.
      run: mvn clean install -Dgraalvm.buildargs="--allow-incomplete-classpath --report-unsupported-elements-at-runtime"

    - name: Output artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows Native Binary
        path: native-image/target/hedgehog.exe
        

        
        
      