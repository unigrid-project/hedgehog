name: Build Windows (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven

    # FIX: Explicitly load the assembly type so PowerShell can create the mock zip.
    # This prevents the maven-antrun-plugin from crashing on 'clean install'.
    - name: Mock Missing Jlink Bundle for Ant
      shell: powershell
      run: |
        Add-Type -AssemblyName "System.IO.Compression.FileSystem"
        New-Item -ItemType Directory -Force -Path "native-image/target"
        $emptyDir = New-Item -ItemType Directory -Force -Path "native-image/target/empty_mock"
        [System.IO.Compression.ZipFile]::CreateFromDirectory($emptyDir.FullName, "native-image/target/hedgehog-native-0.0.8-SNAPSHOT-jlink.zip")

    - name: Build with Maven
      shell: cmd
      run: mvn clean install -Dnative.image.args="--allow-incomplete-classpath --report-unsupported-elements-at-runtime --no-fallback"

    - name: Output artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows Native Binary
        path: native-image/target/hedgehog.exe
        
      