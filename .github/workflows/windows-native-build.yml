name: Build Windows
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', components: 'native-image' }
      
      - name: Locate and Prepare Resources
        shell: cmd
        run: |
          if not exist "native-image\src\main\resources" mkdir "native-image\src\main\resources"
          for /r %i in (jlink.zip) do copy "%i" "native-image\src\main\resources\"
          for /r %i in (application.properties) do copy "%i" "native-image\src\main\resources\"
          dir "native-image\src\main\resources\"
          
      - run: mvn clean install -DskipTests=true
      - shell: cmd
        run: |
          call vcvarsall.bat x64
          mvn package -pl native-image -am -DskipTests=true
      - name: Verify
        run: .\native-image\target\hedgehog.exe --version
        






          
          
          


          
          


          