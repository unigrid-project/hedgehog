name: Build Windows
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', components: 'native-image' }

      - name: Prepare and Build
        shell: cmd
        run: |
          call vcvarsall.bat x64
          mvn clean install -DskipTests=true
          mkdir native-image\src\main\resources
          copy native-image\target\*-jlink.zip native-image\src\main\resources\jlink.zip
          copy application.properties native-image\src\main\resources\
          copy hash.txt native-image\src\main\resources\
          
          echo {"resources": {"includes": [{"pattern": "jlink.zip"}, {"pattern": "application.properties"}, {"pattern": "hash.txt"}]}} > native-image\src\main\resources\resource-config.json
          
          mkdir native-image\target\classes
          copy native-image\src\main\resources\* native-image\target\classes\
          
          mvn package -pl native-image -am -DskipTests=true -Dnative.build.args="--verbose -H:ResourceConfigurationFiles=resource-config.json"
          
      - name: Verify
        run: .\native-image\target\hedgehog.exe --version
        
        












          
          
          


          
          


          