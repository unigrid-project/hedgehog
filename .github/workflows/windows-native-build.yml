name: Build Windows (amd64) Executable
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', components: 'native-image' }
      - run: mvn clean install -DskipTests=true
      - name: Build Native Image
        shell: cmd
        run: |
          call vcvarsall.bat x64
          mvn package -pl native-image -am -DskipTests=true
      - name: Run Hedgehog (Verify)
        run: .\native-image\target\hedgehog.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: hedgehog-windows-output
          path: native-image/target/hedgehog.exe



          
          
          


          
          


          