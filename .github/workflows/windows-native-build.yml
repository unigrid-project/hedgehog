name: Build Windows
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', components: 'native-image' }
      
      - name: Prepare Resources
        shell: cmd
        run: |
          if not exist "native-image\src\main\resources" mkdir "native-image\src\main\resources"
          copy "src\main\resources\*" "native-image\src\main\resources\" /y
          
      - run: mvn clean install -DskipTests=true
      - shell: cmd
        run: |
          call vcvarsall.bat x64
          mvn package -pl native-image -am -DskipTests=true
          
      - name: Verify
        run: .\native-image\target\hedgehog.exe --version
        
      - uses: actions/upload-artifact@v4
        with: { name: hedgehog-win, path: native-image\target\hedgehog.exe }
        




          
          
          


          
          


          