name: Build Windows (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven

    # FIX: Pre-create the target folder and a valid zip file structure 
    # to stop maven-antrun-plugin from crashing during the clean install lifecycle.
    - name: Mock Missing Jlink Bundle for Ant
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "native-image/target"
        [System.IO.Compression.ZipFile]::CreateFromDirectory((New-Item -ItemType Directory -Force -Path "native-image/target/empty_mock"), "native-image/target/hedgehog-native-0.0.8-SNAPSHOT-jlink.zip")

    - name: Build with Maven
      shell: cmd
      run: mvn clean install -Dnative.image.args="--allow-incomplete-classpath --report-unsupported-elements-at-runtime --no-fallback"
      
        
      