name: Build Windows (amd64) Executable

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        description: Skip Test Suite

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # GraalVM Native Image requires the MSVC environment to be set up first
    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm' # This provides the missing 'gu' and native-image tools
        cache: maven

    - name: Build with Maven
      # Using 'shell: cmd' is often safer for MSVC path integration
      shell: cmd
      run: mvn package -DskipTests=${{ github.event.inputs.skip-tests }} -Pnative

    - name: Output artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows Native Binary
        path: native-image/target/hedgehog.exe

    - name: Run Binary
      run: native-image/target/hedgehog.exe
