name: Build Windows (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven

    # Creates the target directory and a placeholder zip file to prevent 
    # the maven-antrun-plugin from throwing a missing file exception.
    - name: Pre-create Missing Ant Target Bundle
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "native-image/target"
        Set-Content -Path "native-image/target/hedgehog-native-0.0.8-SNAPSHOT-jlink.zip" -Value "placeholder"

    - name: Build with Maven
      shell: cmd
      run: mvn clean install -Dnative.image.args="--allow-incomplete-classpath --report-unsupported-elements-at-runtime --no-fallback"
      

        
        
      