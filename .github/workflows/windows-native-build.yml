name: Build Windows
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', components: 'native-image' }

      # 1. FLYTTA FILERNA INNAN NÅGOT BYGGE STARTAR
      - name: Prepare Resources
        shell: bash
        run: |
          mkdir -p native-image/src/main/resources
          cp jlink.zip native-image/src/main/resources/
          cp application.properties native-image/src/main/resources/
          cp hash.txt native-image/src/main/resources/
          echo "Resurser är nu på plats i native-image/src/main/resources/"

      # 2. NU KAN MAVEN SE FILERNA
      - run: mvn clean install -DskipTests=true
      - shell: cmd
        run: |
          call vcvarsall.bat x64
          mvn package -pl native-image -am -DskipTests=true
          
      - name: Verify
        run: .\native-image\target\hedgehog.exe --version
        










          
          
          


          
          


          