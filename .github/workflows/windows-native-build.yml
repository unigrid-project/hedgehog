name: Build Windows (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven

    - name: Maven Clean
      shell: cmd
      run: mvn clean

    - name: Mock Missing Jlink Bundle for Ant
      shell: powershell
      run: |
        Add-Type -AssemblyName "System.IO.Compression.FileSystem"
        $targetDir = New-Item -ItemType Directory -Force -Path "native-image/target"
        $emptyDir = New-Item -ItemType Directory -Force -Path "native-image/target/empty_mock"
        [System.IO.Compression.ZipFile]::CreateFromDirectory($emptyDir.FullName, "$($targetDir.FullName)\hedgehog-native-0.0.8-SNAPSHOT-jlink.zip")

    # We inject the resource pattern globally using env so GraalVM is forced to include the hedgehog graphics
    - name: Build with Maven
      shell: cmd
      env:
        NATIVE_IMAGE_IMAGE_ARGS: "-H:IncludeResources=.*\\.txt$|.*\\.ascii$"
      run: mvn install -DskipTests
      
        

        
      