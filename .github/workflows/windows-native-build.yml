name: Build Windows
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', components: 'native-image' }

      - name: Prepare and Build
        shell: cmd
        run: |
          call vcvarsall.bat x64
          wmic pagefileset where name="C:\\pagefile.sys" set InitialSize=8192,MaximumSize=8192
          
          # Inaktivera metadata-repo för att undvika krockar
          mvn clean install -DskipTests=true -Dnative.maven.plugin.metadata.repository.enabled=false
          
          if exist native-image\target\graalvm-reachability-metadata rmdir /s /q native-image\target\graalvm-reachability-metadata
          
          mkdir native-image\src\main\resources\META-INF\native-image
          
          copy application\src\main\resources\application.properties native-image\src\main\resources\
          copy application\src\main\resources\hash.txt native-image\src\main\resources\
          copy native-image\target\*-jlink.zip native-image\src\main\resources\jlink.zip
          
          echo {"resources": {"includes": [{"pattern": "jlink.zip"}, {"pattern": "application.properties"}, {"pattern": "hash.txt"}]}} > native-image\src\main\resources\META-INF\native-image\resource-config.json
          
          mvn package -pl native-image -am -DskipTests=true
          
      - name: Verify
        run: .\native-image\target\hedgehog.exe --version
        




        












          
          
          


          
          


          