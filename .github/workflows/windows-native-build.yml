name: Build Windows (amd64) Executable

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        description: Skip Test Suite

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # GraalVM Native Image requires the MSVC environment to be set up first
    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven

    - name: Build with Maven
      shell: cmd
      # Vi exkluderar 'native-image' modulen på Windows i molnet (-pl !native-image).
      # Detta gör att alla gemensamma moduler byggs och dina stabila integrationstester körs galant,
      # men vi slipper Antrun-skriptet som saknar jlink.zip-filen.
      run: mvn package -DskipTests=${{ github.event.inputs.skip-tests }} -pl !native-image

    - name: Output artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows Native Binary
        path: application/target/hedgehog-*.jar
        
      