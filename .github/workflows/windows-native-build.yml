name: Build Windows (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven

    # Step 1: Run clean first so the target folder is wiped out safely
    - name: Maven Clean
      shell: cmd
      run: mvn clean

    # Step 2: Create the mock zip file inside the newly wiped target directory
    - name: Mock Missing Jlink Bundle for Ant
      shell: powershell
      run: |
        Add-Type -AssemblyName "System.IO.Compression.FileSystem"
        $targetDir = New-Item -ItemType Directory -Force -Path "native-image/target"
        $emptyDir = New-Item -ItemType Directory -Force -Path "native-image/target/empty_mock"
        [System.IO.Compression.ZipFile]::CreateFromDirectory($emptyDir.FullName, "$($targetDir.FullName)\hedgehog-native-0.0.8-SNAPSHOT-jlink.zip")

    # Step 3: Run install without clean so our mock file survives and gets picked up
    - name: Build with Maven
      shell: cmd
      run: mvn install -Dnative.image.args="--allow-incomplete-classpath --report-unsupported-elements-at-runtime --no-fallback -H:IncludeResources=.*\.properties$|.*\.txt$|.*\.ascii$|.*\.json$|.*\.xml$|META-INF/services/.*$" -DskipTests

    - name: Output artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows Native Binary
        path: native-image/target/hedgehog.exe
        



        
      