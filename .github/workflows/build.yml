name: Hedgehog build status

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      # Only the badges branch is ever written
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and test common and application
        run: mvn -B -ntp -pl common,application verify

      - name: Write the badge endpoint
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          awk -F, '
            NR > 1 { missed += $8; covered += $9 }
            END {
              percent = 100 * covered / (missed + covered)
              color = percent >= 90 ? "brightgreen" : percent >= 80 ? "green" : percent >= 70 ? "yellowgreen" : percent >= 60 ? "yellow" : "orange"
              printf "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"%.1f%%\",\"color\":\"%s\"}\n", percent, color
            }
          ' application/target/jacoco-results/jacoco.csv | tee "$RUNNER_TEMP/coverage.json"

      - name: Publish the badge to the badges branch
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/badges"
          cd "$RUNNER_TEMP/badges"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin badges; then
            git checkout -q -B badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Update the coverage badge"
          git push -q origin badges
