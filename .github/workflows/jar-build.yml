name: Build Java Package

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        description: Skip Test Suite

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Native Image Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libz-dev zlib1g-dev

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven

    - name: Build with Maven
      run: mvn install -DskipTests=${{ inputs.skip-tests }}

    - name: Create Java package
      run: |
        cd application
        mvn package -DskipTests=true

    - name: Output artifact
      uses: actions/upload-artifact@v4
      with:
        name: Java Package
        path: application/target/hedgehog-*-jar-with-dependencies.jar
