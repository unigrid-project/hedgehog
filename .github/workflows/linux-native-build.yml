name: Build Linux
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', components: 'native-image' }

      - name: Prepare and Build
        run: |
          mvn clean install -DskipTests=true
          # Skapa mappstruktur för resurser och GraalVM-konfiguration
          mkdir -p native-image/src/main/resources/META-INF/native-image
          
          # Kopiera resurser till källkodsmappen (där Maven plockar upp dem)
          cp native-image/target/*-jlink.zip native-image/src/main/resources/jlink.zip
          cp application.properties native-image/src/main/resources/
          cp hash.txt native-image/src/main/resources/
          
          # Skapa resurs-konfigurationen på rätt plats (automatiskt upptäckt av GraalVM)
          echo '{"resources": {"includes": [{"pattern": "jlink.zip"}, {"pattern": "application.properties"}, {"pattern": "hash.txt"}]}}' > native-image/src/main/resources/META-INF/native-image/resource-config.json
          
          # Bygg projektet
          mvn package -pl native-image -am -DskipTests=true
      
      - name: Verify
        run: |
          chmod +x native-image/target/hedgehog
          ./native-image/target/hedgehog --version
          












          
          
          


          
          

          
          
          
          
          
          
