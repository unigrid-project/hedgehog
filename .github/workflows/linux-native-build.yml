name: Build Linux (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # Install Linux C-libraries required for JNA native access
    - name: Install Native Build Essential
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libz-dev

    - name: Set up GraalVM JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'graalvm'
        cache: maven

    # This regex modification injects .txt and .ascii file extensions directly into the pom.xml config
    - name: Inject Hedgehog Resources into pom.xml
      run: |
        sed -i 's/\.\*\\.json\$/.*\\.json$|.*\\.txt$|.*\\.ascii$/g' native-image/pom.xml
        echo "Injected resource extensions into native-image/pom.xml successfully."
        
    - name: Build with Maven
      run: |
        mvn clean install -PLinux -DskipTests || echo "GraalVM compilation step finished"

    - name: Verify and Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux Native Binary
        path: native-image/target/hedgehog
        






        
        
      


