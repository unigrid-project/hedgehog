name: Build Linux
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', components: 'native-image' }

      - name: Prepare and Build
        run: |
          mvn clean install -DskipTests=true
          mkdir -p native-image/src/main/resources
          cp native-image/target/*-jlink.zip native-image/src/main/resources/jlink.zip
          cp application.properties native-image/src/main/resources/
          cp hash.txt native-image/src/main/resources/
          
          # Skapa resurs-konfiguration
          echo '{"resources": {"includes": [{"pattern": "jlink.zip"}, {"pattern": "application.properties"}, {"pattern": "hash.txt"}]}}' > native-image/src/main/resources/resource-config.json
          
          # Tvinga in i target/classes för GraalVM
          mkdir -p native-image/target/classes
          cp native-image/src/main/resources/* native-image/target/classes/
          
          mvn package -pl native-image -am -DskipTests=true -Dnative.build.args="--verbose -H:ResourceConfigurationFiles=resource-config.json"
      
      - name: Verify
        run: |
          chmod +x native-image/target/hedgehog
          ./native-image/target/hedgehog --version
          











          
          
          


          
          

          
          
          
          
          
          
