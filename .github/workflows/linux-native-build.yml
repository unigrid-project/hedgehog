name: Build Linux (amd64) Native Executable

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        description: Skip Test Suite
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up GraalVM JDK
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cache: maven

    - name: Build JAR
      run: |
        if [ "${{ inputs.skip-tests }}" = "true" ]; then
          mvn -B clean package -DskipTests
        else
          mvn -B clean package
        fi

    - name: Build Native Image
      run: |
        native-image \
          -jar target/*.jar \
          -H:Name=hedgehog \
          -H:Path=native-image

    - name: Verify binary exists
      run: |
        ls -lah native-image
        test -f native-image/hedgehog

    - name: Make executable
      run: chmod +x native-image/hedgehog

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-amd64-native
        path: native-image/hedgehog

    - name: Smoke test binary (non-blocking)
      run: |
        timeout 5s ./native-image/hedgehog || echo "Binary executed (or timed out safely)"
