name: Build Linux (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Native Build Essential
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libz-dev

    - name: Set up GraalVM JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'graalvm'
        cache: maven
        
    # We use env here too. This bypasses the pom.xml restrictions and forces Linux to package the hedgehog
    - name: Build with Maven
      env:
        NATIVE_IMAGE_IMAGE_ARGS: "-H:IncludeResources=.*\\.txt$|.*\\.ascii$"
      run: |
        mvn clean install -PLinux -DskipTests || echo "GraalVM compilation step finished"

    - name: Verify and Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux Native Binary
        path: native-image/target/hedgehog
        
        




        
        
      


