name: Build Linux (amd64) Native Executable

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        description: Skip Test Suite
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven

    - name: Build JAR with Maven
      run: |
        if [ "${{ inputs.skip-tests }}" = "true" ]; then
          mvn clean package -DskipTests
        else
          mvn clean package
        fi

    - name: Find JAR file
      run: |
        JAR_FILE=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "*sources.jar" ! -name "*javadoc.jar" | head -n 1)

        if [ -z "$JAR_FILE" ]; then
          echo "No JAR file found in target/"
          exit 1
        fi

        echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV

    - name: Build Native Image
      run: |
        native-image \
          -jar "$JAR_FILE" \
          -H:Name=hedgehog \
          -H:Path=native-image

    - name: Verify binary exists
      run: |
        ls -lah native-image
        test -f native-image/hedgehog

    - name: Make binary executable
      run: chmod +x native-image/hedgehog

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-amd64-native
        path: native-image/hedgehog

    - name: Run binary (safe smoke test)
      run: |
        timeout 5s ./native-image/hedgehog || echo "Binary executed or timed out safely"
