name: Build Linux
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', components: 'native-image' }
      
      - name: Locate and Prepare Resources
        run: |
          mkdir -p native-image/src/main/resources
          # Sök igenom hela projektet efter jlink.zip och kopiera den
          find . -name "jlink.zip" -exec cp {} native-image/src/main/resources/ \;
          find . -name "application.properties" -exec cp {} native-image/src/main/resources/ \;
          ls -R native-image/src/main/resources/
          
      - run: mvn clean install -DskipTests=true
      - run: mvn package -pl native-image -am -DskipTests=true
      - name: Verify
        run: |
          chmod +x native-image/target/hedgehog
          ./native-image/target/hedgehog --version






          
          
          


          
          

          
          
          
          
          
          
