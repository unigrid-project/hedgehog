name: Build Linux
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', components: 'native-image' }
      
      - name: Debug and Prepare
        run: |
          ls -R src/main/resources
          mkdir -p native-image/src/main/resources
          cp src/main/resources/jlink.zip native-image/src/main/resources/ || echo "Filen hittades ej i src/main/resources"
          
      - run: mvn clean install -DskipTests=true
      - run: mvn package -pl native-image -am -DskipTests=true
      - name: Verify
        run: |
          chmod +x native-image/target/hedgehog
          ./native-image/target/hedgehog --version
          





          
          
          


          
          

          
          
          
          
          
          
