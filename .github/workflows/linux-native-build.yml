name: Build Linux (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up GraalVM JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' # Set to 21 to natively match the source code release target
        distribution: 'graalvm' # Using GraalVM distribution for optimal native capabilities
        cache: maven
        
    - name: Build with Maven
      # We activate the Linux profile and force the GraalVM AOT analyzer to generate 
      # the native target binary regardless of dynamic runtime dependencies.
      run: mvn clean install -PLinux -Dgraalvm.buildargs="--allow-incomplete-classpath --report-unsupported-elements-at-runtime"
      
    - name: Output artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux Native Binary
        path: native-image/target/hedgehog
        

        
        
      


