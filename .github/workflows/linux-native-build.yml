name: Build Linux (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # Install Linux C-libraries required for JNA native access
    - name: Install Native Build Essential
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libz-dev

    # WE UPGRADE TO JDK 25 JUST LIKE WINDOWS TO SOLVE THE WELD/NETTY COMPILATION ERROR
    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven

    # Keep the working text-resource injection patch
    - name: Patch pom.xml for Linux Compatibility
      run: |
        sed -i 's/\.\*\\.json\$/.*\\.json$|.*\\.txt$|.*\\.ascii$/g' native-image/pom.xml
        echo "Successfully patched pom.xml resources."
        
    - name: Build with Maven
      run: |
        mvn clean install -PLinux -DskipTests || echo "GraalVM compilation step finished"

    - name: Verify and Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux Native Binary
        path: native-image/target/hedgehog
        






        
        
      


