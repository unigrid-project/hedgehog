name: Build Linux (amd64) Executable

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        description: Skip Test Suite

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up GraalVM JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' # Uppgraderat till version 21 så att den stöder din kodes release-target!
        distribution: 'graalvm' # Använder GraalVM här också för optimal native-kompilation
        cache: maven
        
    - name: Build with Maven
      run: mvn package -DskipTests=${{ inputs.skip-tests }} -PLinux
      
    - name: Output artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux Native Binary
        path: native-image/target/hedgehog.bin
        
    - name: Run Binary
      run: native-image/target/hedgehog.bin
      


