name: Build Linux
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', components: 'native-image' }

      - run: mvn clean install -DskipTests=true

      - name: Prepare Resources from Target
        run: |
          mkdir -p native-image/src/main/resources
          # Kopierar från target-mappen där de skapades
          cp native-image/target/*-jlink.zip native-image/src/main/resources/jlink.zip
          cp application.properties native-image/src/main/resources/ || echo "Application properties saknas"
          cp hash.txt native-image/src/main/resources/ || echo "Hash saknas"

      - run: mvn package -pl native-image -am -DskipTests=true
      
      - name: Verify
        run: |
          chmod +x native-image/target/hedgehog
          ./native-image/target/hedgehog --version
          










          
          
          


          
          

          
          
          
          
          
          
