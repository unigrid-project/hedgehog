name: Build Linux (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    # Upgraded to ubuntu-latest to avoid long infrastructure queues on older runners
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up GraalVM JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' # Set to 21 to natively match the source code release target
        distribution: 'graalvm' # Using GraalVM distribution for optimal native capabilities
        cache: maven
        
    - name: Build with Maven
      # 'clean' wipes out old artifacts to avoid hidden bugs, 'install' runs all tests
      # and forces GraalVM to compile the native target safely via workaround arguments.
      run: mvn clean install -PLinux -Dnative-image.args="--allow-incomplete-classpath --report-unsupported-elements-at-runtime"
      
    - name: Output artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux Native Binary
        path: native-image/target/hedgehog
        
        
        
      


