name: Build Linux (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up GraalVM JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'graalvm'
        cache: maven
        
    - name: Build with Maven
      # Runs the standard clean install lifecycle. If the internal Java class 
      # org.unigrid.hedgehog.nativeimage.NativeImage still fails, it means the källkod 
      # inside that Java class requires local configuration files to build.
      run: mvn clean install -PLinux -Dnative.image.args="--allow-incomplete-classpath --report-unsupported-elements-at-runtime --no-fallback"
      



        
        
      


