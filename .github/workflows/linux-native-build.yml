name: Build Linux (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up GraalVM JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'graalvm'
        cache: maven
        
    - name: Build with Maven
      # Runs clean install with standard native arguments. 
      # Note: If this still fails, check the main method inside NativeImage.java 
      # to ensure it doesn't rely on hardcoded local file paths.
      run: mvn clean install -PLinux -Dnative.image.args="--allow-incomplete-classpath --report-unsupported-elements-at-runtime --no-fallback"
      
        
        
      


