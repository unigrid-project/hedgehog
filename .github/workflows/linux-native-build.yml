name: Build Linux (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # Install Linux C-libraries required for JNA native access
    - name: Install Native Build Essential
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libz-dev

    - name: Set up GraalVM JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'graalvm'
        cache: maven
        
    # Run clean install with Linux profile and resource flags, catching any post-generation wrapper exit codes
    - name: Build with Maven
      run: |
        mvn clean install -PLinux -DskipTests -Dnative.image.args="--allow-incomplete-classpath --report-unsupported-elements-at-runtime --no-fallback -H:IncludeResources=.*\.properties$|.*\.txt$|.*\.ascii$|.*\.json$|.*\.xml$|META-INF/services/.*$" || echo "Maven finished"

    - name: Verify and Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux Native Binary
        path: native-image/target/hedgehog
        


        
        
      


