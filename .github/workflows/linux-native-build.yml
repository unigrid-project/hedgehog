name: Build Linux Native

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 1. Kör tester separat med CI-profilen
      - name: Run Tests
        run: mvn test -Pci -Dtest.threshold=0.3 -Dtest.envFactor=10
        
      # 2. Bygg binären separat
      - name: Build Native Image
        run: mvn package -Pnative -DskipTests=true

      - name: Prepare Test Environment
        run: |
          mkdir -p native-image/target/bootstrap
          cp path/to/bootstrap.tar.xz native-image/target/bootstrap/ 2>/dev/null || echo "Ingen bootstrap hittades"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hedgehog-linux
          path: native-image/target/hedgehog
          
          
