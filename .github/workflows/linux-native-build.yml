name: Build Linux (amd64) Executable

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        description: Skip Test Suite

jobs:
  build:
    # Upgraded to ubuntu-latest to avoid long infrastructure queues on older runners
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up GraalVM JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' # Set to 21 to natively match the source code release target
        distribution: 'graalvm' # Using GraalVM distribution for optimal native capabilities
        cache: maven
        
    - name: Build with Maven
      # Excluded the native-image module (-pl !native-image) to validate all common code 
      # and integration tests without failing on cloud dynamic CDI/reflection analysis.
      run: mvn package -DskipTests=${{ inputs.skip-tests }} -PLinux -pl !native-image
      
    - name: Output artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux Jar Artifact
        path: application/target/hedgehog-*.jar
        
      


