name: Build Linux (amd64) Executable

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        description: Skip Test Suite

jobs:
  build:
    # Ändrat från ubuntu-20.04 till ubuntu-latest för att slippa kön
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 # Uppdaterad till v4 för bättre kompabilitet
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4 # Uppdaterad till v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn package -DskipTests=${{ inputs.skip-tests }} -PLinux
      
    - name: Output artifact
      uses: actions/upload-artifact@v4 # Uppdaterad till v4
      with:
        name: Linux Native Binary
        path: native-image/target/hedgehog.bin
        
    - name: Run Binary
      run: native-image/target/hedgehog.bin
      

