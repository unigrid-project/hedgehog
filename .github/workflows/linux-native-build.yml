name: Build Linux (amd64) Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up GraalVM JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'graalvm'
        cache: maven
        
    - name: Build with Maven
      # We enforce the Linux profile and feed the native-image compiler double properties 
      # to guarantee that the standalone 'hedgehog' binary is generated in the target directory.
      run: mvn clean install -PLinux -Dnative.image.args="--allow-incomplete-classpath --report-unsupported-elements-at-runtime --no-fallback" -Dgraalvm.buildargs="--allow-incomplete-classpath --report-unsupported-elements-at-runtime --no-fallback"
      
    - name: Output artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux Native Binary
        path: native-image/target/hedgehog
        


        
        
      


