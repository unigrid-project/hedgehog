name: Build Linux (amd64) Executable
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', components: 'native-image' }
      - run: mvn clean install -DskipTests=true
      - run: mvn package -pl native-image -am -DskipTests=true
      - name: Kopiera resurser till target
        run: |
          cp jlink.zip native-image/target/
          cp application.properties native-image/target/
      - name: Kör Igelkotten
        run: |
          chmod +x native-image/target/hedgehog
          ./native-image/target/hedgehog --version
      - uses: actions/upload-artifact@v4
        with:
          name: hedgehog-linux-output
          path: native-image/target/hedgehog
          

          
          
          


          
          

          
          
          
          
          
          
