name: Build Linux (amd64) Executable

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        description: Skip Test Suite

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Changed from setup-java (Temurin) to setup-graalvm
    - name: Set up GraalVM for JDK 25
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25' 
        distribution: 'graalvm'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cache: maven

    - name: Build with Maven
      run: mvn package -DskipTests=${{ inputs.skip-tests }}

    - name: Output artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux Native Binary
        path: native-image/target/hedgehog.bin

    - name: Run Binary
      run: |
        # Find the file, make it executable, and run it
        # This assumes there is only one executable in that folder
        BINARY_PATH=$(find hedgehog-native/target -maxdepth 1 -type f -executable -not -name "*.jar" | head -n 1)
        echo "Executing: $BINARY_PATH"
        chmod +x "$BINARY_PATH"
        "$BINARY_PATH"
