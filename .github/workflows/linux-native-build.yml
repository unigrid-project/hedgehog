name: Build Linux (amd64) Native Executable

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '17'
        distribution: 'graalvm'
        cache: maven

    - name: Build JAR
      run: |
        if [ "${{ inputs.skip-tests }}" = "true" ]; then
          mvn clean package -DskipTests
        else
          mvn clean package
        fi

    - name: Build Native Image
      run: |
        native-image \
          -jar target/*.jar \
          -H:Name=hedgehog \
          -H:Path=native-image

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: linux-native
        path: native-image/hedgehog

    - name: Run binary (safe)
      run: |
        chmod +x native-image/hedgehog
        timeout 5s ./native-image/hedgehog
